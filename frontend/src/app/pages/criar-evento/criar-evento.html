<div class="agenda-page">
  <div class="agenda-header">
    <span class="section-eyebrow">Meu Planejamento</span>
    <h1 class="agenda-title">MINHA <em>AGENDA</em></h1>
    <p class="agenda-subtitle">Você tem {{ items.length }} eventos salvos para este mês.</p>
  </div>

  <div class="agenda-list">
    <ng-container *ngFor="let month of months">
      <div class="month-divider">{{ month }}</div>
      <div class="agenda-item" *ngFor="let item of getByMonth(month)" (click)="svc.openModal(item.eventKey)">
        <div class="agenda-date">
          <span class="day">{{ item.day }}</span>
          <span class="weekday">{{ item.weekday }}</span>
        </div>
        <div class="agenda-info">
          <span class="agenda-tag">{{ item.tag }}</span>
          <h3>{{ item.name }}</h3>
          <p>📍 {{ item.location }}</p>
        </div>
        <span class="status-badge" [class.confirmed]="item.status === 'confirmed'">
          {{ item.status === 'confirmed' ? 'Confirmado' : 'Interesse' }}
        </span>
        <button class="remove-btn" (click)="remove($event, item)">✕</button>
      </div>
    </ng-container>

    <div class="agenda-add-card" (click)="svc.showPage('home')">
      <div class="add-icon">+</div>
      <p>Encontrar mais eventos para sua agenda</p>
    </div>
  </div>
</div>
