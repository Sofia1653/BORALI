<div class="perfil-page">
  <div class="perfil-layout">

    <div class="profile-sidebar">
      <div class="profile-avatar-wrap">
        S
        <button class="edit-avatar-btn">✎</button>
      </div>
      <div class="profile-name-big">Sofia</div>
      <p class="profile-location-txt">Recife, PE · Membro desde 2026</p>
      <div class="profile-stats-mini">
        <div class="p-stat"><strong>12</strong>Salvos</div>
        <div class="p-stat"><strong>34</strong>Vistos</div>
        <div class="p-stat"><strong>5</strong>Bairros</div>
      </div>
    </div>

    <div>
      <div class="profile-block">
        <div class="block-title">MEUS INTERESSES</div>
        <p class="block-desc">Selecione os temas que você deseja ver com mais frequência.</p>
        <div class="interests-wrap">
          <button class="interest-tag" *ngFor="let tag of interestTags"
                  [class.active]="tag.active"
                  (click)="toggleInterest(tag)">{{ tag.label }}</button>
        </div>
      </div>

      <div class="profile-block">
        <div class="block-title">CONFIGURAÇÕES E PRIVACIDADE</div>
        <div class="setting-row" *ngFor="let s of settings">
          <div class="setting-info">
            <strong>{{ s.title }}</strong>
            <p>{{ s.desc }}</p>
          </div>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="s.on">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="profile-actions">
        <button class="btn-save-profile" (click)="svc.showToast('✓ Perfil salvo com sucesso!')">Salvar Alterações</button>
        <button class="btn-danger" (click)="svc.showToast('Conta excluída (simulado)')">Excluir minha conta</button>
      </div>
    </div>

  </div>
</div>
